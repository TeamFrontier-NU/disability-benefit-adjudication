T1:
  answer: "yes"
  explanation:
    en: "**Yes — fast track.** The rehabilitation note confirms **complete loss of function in both legs** due to spinal cord injury. The state agency got the note **directly from the hospital**. The loss lasted continuously from **2026-04-10 to 2026-08-19**, more than **3 months**."
    zh: "**是，推荐进入快车道。** 康复病历确认脊髓损伤导致**双腿功能完全丧失**。州机构**直接向医院调取**了这份病历。功能丧失从 **2026-04-10 持续到 2026-08-19**，已超过 **3 个月**。"
    es: "**Sí, revisión acelerada.** La nota de rehabilitación confirma la **pérdida total de la función de ambas piernas** por una lesión de la médula espinal. La agencia estatal obtuvo la nota **directamente del hospital**. La pérdida continuó desde el **2026-04-10 hasta el 2026-08-19**, durante más de **3 meses**."
Q1:
  answer: "no"
  explanation:
    en: "**No — regular review.** The applicant’s uploaded letter names **small cell lung cancer**, but the record obtained directly from the clinic confirms only a **mass in the lung**. The key diagnosis still needs verification. The signed authorization lets the agency request records; it does not confirm the diagnosis."
    zh: "**否，进入常规审核。** 申请人上传的信写明**小细胞肺癌**，但直接从诊所调取的记录只确认有**肺部肿块**。关键诊断仍需核实。签署授权仅允许机构调取记录，不能证明诊断。"
    es: "**No, revisión regular.** La carta que subió la persona solicitante menciona **cáncer de pulmón de células pequeñas**, pero el registro que vino directamente de la clínica solo confirma **una masa en el pulmón**. Aún falta verificar el diagnóstico clave. La autorización firmada permite pedir registros; no confirma el diagnóstico."
Q2:
  answer: "yes"
  explanation:
    en: "**Yes — fast track.** The laboratory report came **directly from the hospital** and confirms **small cell lung cancer**. The diagnosis is recent, but this study’s rule **does not require a 3-month wait** for this condition."
    zh: "**是，推荐进入快车道。** 这份化验报告**直接来自医院**，并明确确诊**小细胞肺癌**。虽然确诊时间不长，但按本研究规则，这种病情**无需等待 3 个月**。"
    es: "**Sí, revisión acelerada.** El informe llegó **directamente del hospital** y confirma **cáncer de pulmón de células pequeñas**. Aunque el diagnóstico es reciente, las reglas de este estudio **no exigen esperar 3 meses** para esta afección."
